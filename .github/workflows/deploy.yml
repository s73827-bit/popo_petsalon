# main 브랜치에 push하면 사이트를 빌드해 GitHub Pages에 배포한다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 지정해야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json의 packageManager(pnpm@11.25.0) 버전을 그대로 쓴다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 구글 지도 키는 저장소 Settings → Secrets and variables → Actions의 GOOGLE_MAPS_EMBED_KEY.
      # 없으면 지도 영역만 숨긴 채로 빌드된다.
      - run: pnpm build
        env:
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.GOOGLE_MAPS_EMBED_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
